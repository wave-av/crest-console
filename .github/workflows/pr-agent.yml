# pr-agent (OSS) — inlined for public callers.
# Public repos cannot call private reusable workflows (wave-foundation), so this
# vendors the OSS Qodo Merge lane locally — same constraint that makes
# foundation-gate call ./.github/workflows/_checks.yml instead of the remote.
# Engine: OSS Qodo Merge on our OPENAI_KEY (trial-independent).
name: pr-agent (OSS)
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    name: Run pr-agent on pull requests and respond to comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@f6af7d77554ff8d26adffded077e6461329e92fa # v0.42.0
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          github_action_config.handle_push_trigger: "true"
